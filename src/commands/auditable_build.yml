description: >
  Builds with cargo auditable, which embeds the resolved dependency list of every binary it links
  (in the .dep-v0 section), for audit_bin and verify_auditable to read back from the shipped file.
  It decides no build options: extra_args passes them all to cargo. Needs cargo and
  cargo-auditable (the install command installs it by default).
parameters:
  working_dir:
    type: string
    default: .
    description: Directory to build in.
  subcommand:
    type: enum
    enum: ["build", "install", "rustc"]
    default: build
    description: The cargo subcommand to run auditably.
  extra_args:
    type: string
    default: ""
    description: >
      The cargo arguments, split like shell words, such as "--release --locked -p app
      --features tls-rustls --target x86_64-unknown-linux-musl"; nothing in them is expanded
      or run. Every argument reaches cargo unchanged, including -Z sbom on nightly Cargo,
      which is unstable.
steps:
  - run:
      name: cargo auditable << parameters.subcommand >>
      working_directory: << parameters.working_dir >>
      environment:
        PARAM_EXTRA_ARGS: << parameters.extra_args >>
        PARAM_SUBCOMMAND: << parameters.subcommand >>
        SCRIPT_RUST_SECURITY_LIB: << include(scripts/lib/rust_security.sh) >>
      command: << include(scripts/auditable_build.sh) >>
