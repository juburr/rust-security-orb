version: 2.1
setup: true
orbs:
  orb-tools: circleci/orb-tools@12.5
  shellcheck: circleci/shellcheck@3.4

filters: &filters
  tags:
    only: /.*/

jobs:
  # Runs every tool's install.sh against fixture releases, offline: the shared install contract for
  # each tool, the download_base_url mirror, the .tar.xz releases, the crates built from source, and
  # that the parts every tool's script shares are identical.
  test-install:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run install tests
          command: bash tests/install_test.sh
  test-env-subst:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run circleci env subst tests
          command: bash tests/env_subst_test.sh
      - run:
          name: Run shell conventions test
          command: bash tests/shell_conventions_test.sh
  # Runs the command scripts, with PARAM_* set directly, against stand-ins for the tools: the exact
  # arguments each one builds, findings, report_only, tools that don't complete, the reports, and
  # run records checked against schemas/run-record.v1.json. Then checks that each command's YAML
  # passes every parameter its script reads.
  test-commands:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - run:
          name: Install jsonschema
          command: pip install --quiet jsonschema==4.26.0
      - run:
          name: Run command tests
          command: bash tests/commands_test.sh
      - run:
          name: Run wiring test
          command: bash tests/wiring_test.sh

workflows:
  lint-pack:
    jobs:
      - test-install:
          filters: *filters
      - test-env-subst:
          filters: *filters
      - test-commands:
          filters: *filters
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          orb_name: rust-security
          filters: *filters
      - shellcheck/check:
          filters: *filters
      # Triggers the next workflow in the Orb Development Kit.
      - orb-tools/continue:
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          orb_name: rust-security-orb
          requires: [test-install, test-env-subst, test-commands, orb-tools/lint, orb-tools/pack, orb-tools/review, shellcheck/check]
          filters: *filters
