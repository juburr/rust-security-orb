      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/rust-security-orb-cargo-vet
        key: ${{ steps.cargo-vet-cache-key.outputs.key }}
    # The key is computed from a file that names the CPU (uname -m), HOME (a
