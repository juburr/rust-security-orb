[package]
name = "rso-fixture"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Test fixture for rust-security-orb: a binary whose dependency graph depends on its features."

[features]
default = ["vulnerable"]
# smallvec 1.6.0 is affected by RUSTSEC-2021-0003, so a build with this
# feature links a crate with a known advisory, and a build without it doesn't.
vulnerable = ["dep:smallvec"]
# Two backends a shipped binary must never combine.
backend-a = ["dep:rso-backend-a"]
backend-b = ["dep:rso-backend-b"]

[dependencies]
smallvec = { version = "=1.6.0", optional = true }
rso-backend-a = { path = "backend-a", optional = true }
rso-backend-b = { path = "backend-b", optional = true }

[workspace]
members = ["backend-a", "backend-b"]
