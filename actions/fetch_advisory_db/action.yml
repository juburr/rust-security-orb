name: Fetch the RustSec advisory database
description: >
  Fetches the RustSec advisory database (a shallow git clone of url), or imports a copy staged
  earlier, into the directory cargo deny reads by default, and exports RUSTSEC_ADVISORY_DB, which
  the audit and audit_bin commands read. Both tools then check against the very same copy: fetch it
  once per workflow, persist it with archive, and import it in later jobs that run with no_fetch
  (audit) or offline (deny). Whether fetched or imported, the copy's age is its newest commit's, so
  both tools tell a stale copy the same way. Needs git. The GitHub Actions twin of the orb's
  fetch_advisory_db command.
author: juburr

inputs:
  archive:
    description: >
      Also write the database, git history included, to this .tar.gz, to upload as an artifact or
      save to a cache, so later jobs import this very copy. The copy's git config keeps only what a
      checkout needs, with credentials stripped from remote URLs, so an imported copy's credentials
      and commands (per-worktree config and hooks included) reach neither the archive nor the
      installed copy. A path inside the database's own directory, or that directory itself, is
      refused, since the archive would hold itself, and so is an existing directory.
    default: ""
  auth_header_env_var:
    description: >
      The environment variable holding an Authorization header value, such as "Bearer <token>" or
      "Basic <base64>", for a private mirror. It reaches git through its environment, never its
      command line, and is never printed.
    default: ""
  db_dir:
    description: >
      The directory to put the database in, under its URL-derived name. Defaults to
      $CARGO_HOME/advisory-dbs ($HOME/.cargo/advisory-dbs), where cargo deny looks without
      configuration; cargo deny reads any other directory only if deny.toml's db-path names it. A
      leading ~/ is expanded.
    default: ""
  import:
    description: >
      Import a copy staged earlier instead of fetching: a directory holding the database's git
      checkout, or a .tar.gz such as archive writes, for example from an artifact. Nothing is
      fetched then, so it works without network access. The copy must be self-contained (plain files
      and directories only, no symbolic links or FIFOs, no commondir, no objects borrowed through
      git clone's --reference or --shared, no submodules), and its files exactly its newest
      commit's, sparse checkouts and assume-unchanged files included.
    default: ""
  url:
    description: >
      The advisory database's git repository: RustSec's, or an internal mirror of it, over https,
      with a path of plain ASCII and no . or .. segments, and a host that is a name or an IPv4
      address written as four decimal numbers. Use the URL your deny.toml's db-urls names, if it
      names one, since the directory cargo deny reads is named after the URL. A database whose
      newest commit is dated in the future fails the step, since neither tool could tell it is
      stale.
    default: "https://github.com/RustSec/advisory-db"

runs:
  using: composite
  steps:
    - name: Fetch the RustSec advisory database
      shell: bash
      env:
        PARAM_ARCHIVE: ${{ inputs.archive }}
        PARAM_AUTH_HEADER_ENV_VAR: ${{ inputs.auth_header_env_var }}
        PARAM_DB_DIR: ${{ inputs.db_dir }}
        PARAM_IMPORT: ${{ inputs.import }}
        PARAM_URL: ${{ inputs.url }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/fetch_advisory_db.sh"
        "SCRIPT_RUST_SECURITY_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/rust_security.sh"
