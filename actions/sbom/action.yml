name: Write CycloneDX SBOMs with cargo cyclonedx
description: >
  Writes CycloneDX SBOMs of a workspace from Cargo's metadata with cargo cyclonedx, one per member
  (or per binary), into output_dir/<report_name>/, keeping their paths relative to the workspace
  root. For an SBOM of exactly what a shipped binary links, use verify_auditable with cyclonedx on a
  binary built with auditable_build. The GitHub Actions twin of the orb's sbom command.
author: juburr

inputs:
  all_features:
    description: >
      Enable every feature.
    default: "false"
  describe:
    description: >
      What each SBOM describes: each crate, each binary (and library) it builds, or every Cargo
      target.
    default: crate
  extra_args:
    description: >
      More cargo cyclonedx options, split like shell words; nothing in them is expanded or run.
      --manifest-path is refused: use manifest_path, whose workspace members this command collects
      the SBOMs from.
    default: ""
  features:
    description: >
      Features to enable, separated by commas or spaces.
    default: ""
  format:
    description: >
      The SBOM format.
    default: json
  locked:
    description: >
      Fail when Cargo.lock is missing or out of date, since cargo cyclonedx would otherwise update
      it and describe versions it doesn't pin.
    default: "true"
  manifest_path:
    description: >
      The Cargo.toml of the workspace to describe (--manifest-path). cargo cyclonedx writes an SBOM
      for every workspace member.
    default: ""
  no_default_features:
    description: >
      Disable the default features.
    default: "false"
  offline:
    description: >
      Use only cargo's cache, without network access (CARGO_NET_OFFLINE).
    default: "false"
  output_dir:
    description: >
      Absolute path of the directory to write the reports into.
    default: /tmp/rust-security-reports
  report_name:
    description: >
      The reports' file name, without extension, so several runs in a job (or a matrix) don't
      overwrite each other's reports.
    default: sbom
  run_record:
    description: >
      Also write <report_name>.run-record.json: cargo-cyclonedx's version and SHA-512 and how it was
      installed, the lockfile's SHA-256, the arguments and every SBOM's SHA-256.
    default: "false"
  spec_version:
    description: >
      The CycloneDX specification version. cargo cyclonedx's own default is 1.3; 1.5 is the newest
      it writes.
    default: "1.5"
  store_artifacts:
    description: >
      Upload output_dir as a workflow artifact, named rust-security-reports-<report_name> and a
      random suffix, including when the step fails.
    default: "true"
  target:
    description: >
      Describe the dependencies of this target triple, or all for every target. Defaults to the
      job's CARGO_BUILD_TARGET, which cargo cyclonedx would use, passed as --target so the run
      record names it, or else the host's. A CARGO_BUILD_TARGET in the environment is ignored when
      this is set.
    default: ""
  top_level:
    description: >
      List only the direct dependencies, not every transitive one.
    default: "false"
  working_dir:
    description: >
      Directory to run cargo cyclonedx in.
    default: .

runs:
  using: composite
  steps:
    # Artifact names must be unique in a workflow run, and the same command
    # can run in several jobs or matrix legs, so the name ends in a random
    # suffix.
    - name: Name the reports artifact
      id: artifact
      if: (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      shell: bash
      env:
        REPORT_NAME: ${{ inputs.report_name }}
      run: |
        if [[ ! "${REPORT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            REPORT_NAME=reports
        fi
        printf 'name=rust-security-reports-%s-%s\n' "${REPORT_NAME}" "$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')" >> "${GITHUB_OUTPUT}"
    - name: cargo cyclonedx
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      env:
        PARAM_ALL_FEATURES: ${{ inputs.all_features }}
        PARAM_DESCRIBE: ${{ inputs.describe }}
        PARAM_EXTRA_ARGS: ${{ inputs.extra_args }}
        PARAM_FEATURES: ${{ inputs.features }}
        PARAM_FORMAT: ${{ inputs.format }}
        PARAM_LOCKED: ${{ inputs.locked }}
        PARAM_MANIFEST_PATH: ${{ inputs.manifest_path }}
        PARAM_NO_DEFAULT_FEATURES: ${{ inputs.no_default_features }}
        PARAM_OFFLINE: ${{ inputs.offline }}
        PARAM_OUTPUT_DIR: ${{ inputs.output_dir }}
        PARAM_REPORT_NAME: ${{ inputs.report_name }}
        PARAM_RUN_RECORD: ${{ inputs.run_record }}
        PARAM_SPEC_VERSION: ${{ inputs.spec_version }}
        PARAM_TARGET: ${{ inputs.target }}
        PARAM_TOP_LEVEL: ${{ inputs.top_level }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/sbom.sh"
        "SCRIPT_RUST_SECURITY_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/rust_security.sh"
    - name: Upload the reports
      if: always() && (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ inputs.output_dir }}
        if-no-files-found: ignore
