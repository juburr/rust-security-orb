description: >
  Fails when the dependency graph cargo tree resolves holds a forbidden package, or a package with
  a forbidden feature enabled: "no HTTP client in the server binary", "the worker-only crates never
  reach the deployed build", "nothing under an unmaintained crate family". Pick the graph the way
  the build does: package for cargo build -p, workspace for a workspace-wide build (where cargo
  unifies features across members), and the features, target and edges that ship. Writes the
  graph cargo tree printed (<report_name>.tree.txt) and a JSON report naming each violation and
  the path from the root to it. A graph that doesn't resolve, such as with a stale lockfile, fails
  the step even with report_only. Needs cargo.
parameters:
  working_dir:
    type: string
    default: .
    description: Directory to run cargo tree in. Relative paths are relative to it.
  manifest_path:
    type: string
    default: ""
    description: >
      The Cargo.toml whose graph to check (cargo tree --manifest-path), relative to working_dir.
      Defaults to the one in working_dir. Environment variables are expanded.
  manifest_paths:
    type: string
    default: ""
    description: >
      Several Cargo.toml files to check instead of manifest_path, each with the same parameters,
      such as standalone fuzz workspaces that share an exception. Separated by commas, spaces or
      newlines; shell patterns are expanded, and one that matches nothing fails the step. Each
      gets its own reports, <report_name>-<slug>, with the slug made from its path as for deny's
      manifest_paths, listed in an index, <report_name>.json. Environment variables are expanded.
  package:
    type: string
    default: ""
    description: >
      The package whose graph to check (cargo tree -p), as name or name@version, such as the
      binary that ships: cargo build -p resolves features for that package alone. Defaults to
      the manifest's package. Environment variables are expanded.
  workspace:
    type: boolean
    default: false
    description: >
      Check the graph of every workspace member together (cargo tree --workspace), where cargo
      unifies each shared crate's features across all of them, as cargo build --workspace does.
  features:
    type: string
    default: ""
    description: Features to enable (--features), separated by commas or spaces.
  all_features:
    type: boolean
    default: false
    description: Enable every feature (--all-features).
  no_default_features:
    type: boolean
    default: false
    description: Disable the default features (--no-default-features).
  target:
    type: string
    default: all
    description: >
      The target whose dependencies count (--target): all, the default, covers every target,
      so a crate a boundary forbids can't hide behind a cfg the CI host doesn't match. Set a
      triple to check one, or leave it empty for the host's. Environment variables are
      expanded.
  edges:
    type: string
    default: ""
    description: >
      The dependency kinds to follow (--edges), separated by commas or spaces: all, normal,
      build, dev, no-normal, no-build, no-dev, no-proc-macro. Defaults to cargo tree's (normal,
      build and dev). no-dev checks what ships, build scripts included.
  locked:
    type: boolean
    default: true
    description: >
      Fail when Cargo.lock is out of date, instead of updating it (--locked). A graph that
      doesn't resolve is an error, never a pass.
  offline:
    type: boolean
    default: false
    description: Resolve without network access (--offline), from cargo's cache.
  frozen:
    type: boolean
    default: false
    description: Both locked and offline (--frozen).
  exception:
    type: string
    default: ""
    description: >
      The exceptions or boundaries this check guards, such as RUSTSEC-2023-0071,
      licence:MPL-2.0 or boundary:server, separated by commas, spaces or newlines. Free-form:
      they are carried into the JSON report and the run record, so a reader can tell what the
      check is a premise of.
  forbidden_packages:
    type: string
    default: ""
    description: >
      Packages that must not be in the graph, by name, separated by commas, spaces or newlines.
      * matches any run of characters and ? any one, against the whole name, so acme-* matches
      acme-sys but not acmes: a crate family is acme acme-*. Environment variables are expanded.
  forbidden_features:
    type: string
    default: ""
    description: >
      Features that must not be enabled, as crate:feature, such as index:writer or
      rpc-kit:transport-*-client*, with the same wildcards on both sides, separated by commas,
      spaces or newlines. Every occurrence of the crate counts: one package can have different
      features as a build dependency and as a normal one. Environment variables are expanded.
  only_if_reachable:
    type: string
    default: ""
    description: >
      Run the check only when this package (name or name@version) is in the graph of
      only_if_reachable_from, or of the selection itself when that is empty. When it isn't, the
      check is skipped, and says so in the JSON report, the JUnit test cases and the run record,
      rather than passing. Environment variables are expanded.
  only_if_reachable_from:
    type: string
    default: ""
    description: >
      The package (name or name@version) whose graph only_if_reachable must be in, with the same
      features, target and edges, such as the shipped binary when the check itself reads the
      workspace-wide graph. Environment variables are expanded.
  output_dir:
    type: string
    default: /tmp/rust-security-reports
    description: >
      Absolute path of the directory to write the reports into. Environment variables are not
      expanded, since the path is also passed to store_artifacts and store_test_results.
  report_name:
    type: string
    default: tree-forbid
    description: >
      The reports' file name, without extension, so several checks in a job don't overwrite each
      other's reports. It is also in the step's name.
  junit:
    type: boolean
    default: false
    description: >
      Also write JUnit XML, one test case per forbidden package and feature pattern, to
      output_dir/junit, and show it in CircleCI's Tests tab: a pattern something matched fails, with
      the path to it; all are skipped when only_if_reachable isn't.
  report_only:
    type: boolean
    default: false
    description: >
      Report findings without failing the step. A graph cargo tree can't resolve, or output
      this command can't read, still fails it.
  run_record:
    type: boolean
    default: false
    description: >
      Also write <report_name>.run-record.json: cargo's version and SHA-512, the inputs'
      SHA-256 (the lockfile and manifests), the arguments, the exceptions, the counts and every
      report's SHA-256.
  store_artifacts:
    type: boolean
    default: true
    description: >
      Store output_dir as job artifacts under rust-security-reports/, including when the step
      fails.
steps:
  - run:
      name: cargo tree forbid (<< parameters.report_name >>)
      working_directory: << parameters.working_dir >>
      environment:
        PARAM_ALL_FEATURES: << parameters.all_features >>
        PARAM_EDGES: << parameters.edges >>
        PARAM_EXCEPTION: << parameters.exception >>
        PARAM_FEATURES: << parameters.features >>
        PARAM_FORBIDDEN_FEATURES: << parameters.forbidden_features >>
        PARAM_FORBIDDEN_PACKAGES: << parameters.forbidden_packages >>
        PARAM_FROZEN: << parameters.frozen >>
        PARAM_JUNIT: << parameters.junit >>
        PARAM_LOCKED: << parameters.locked >>
        PARAM_MANIFEST_PATH: << parameters.manifest_path >>
        PARAM_MANIFEST_PATHS: << parameters.manifest_paths >>
        PARAM_NO_DEFAULT_FEATURES: << parameters.no_default_features >>
        PARAM_OFFLINE: << parameters.offline >>
        PARAM_ONLY_IF_REACHABLE: << parameters.only_if_reachable >>
        PARAM_ONLY_IF_REACHABLE_FROM: << parameters.only_if_reachable_from >>
        PARAM_OUTPUT_DIR: << parameters.output_dir >>
        PARAM_PACKAGE: << parameters.package >>
        PARAM_REPORT_NAME: << parameters.report_name >>
        PARAM_REPORT_ONLY: << parameters.report_only >>
        PARAM_RUN_RECORD: << parameters.run_record >>
        PARAM_TARGET: << parameters.target >>
        PARAM_WORKSPACE: << parameters.workspace >>
        SCRIPT_CARGO_TREE_LIB: << include(scripts/lib/cargo_tree.sh) >>
        SCRIPT_RUST_SECURITY_LIB: << include(scripts/lib/rust_security.sh) >>
      command: << include(scripts/tree_forbid.sh) >>
  - when:
      condition: << parameters.junit >>
      steps:
        - store_test_results:
            path: << parameters.output_dir >>/junit/<< parameters.report_name >>.xml
            when: always
  - when:
      condition: << parameters.store_artifacts >>
      steps:
        - store_artifacts:
            path: << parameters.output_dir >>
            destination: rust-security-reports
            when: always
