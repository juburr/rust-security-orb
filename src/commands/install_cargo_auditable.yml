description: >
  Installs cargo-auditable, which embeds the resolved dependency list in the
  binaries cargo builds, for Linux on amd64 or arm64, picked from the
  machine's CPU architecture, after verifying the SHA-512 checksum of its
  release archive. Unpacking it needs xz. The install command installs it,
  among others, by default.
parameters:
  caching:
    type: boolean
    default: true
    description: >
      Cache the downloaded release between jobs, keyed by version, CPU
      architecture and home directory. Only verified releases are cached, and
      a cached release is verified again before it is installed.
  download_base_url:
    type: string
    default: ""
    description: >
      Base URL of an internal mirror of GitHub releases, such as an
      Artifactory or Nexus remote repository, to download from instead of
      https://github.com. It replaces https://github.com in the release URL,
      so the mirror must serve the same path. It must be an https:// URL.
      What is downloaded is still verified against this orb's checksum table.
      Environment variables are expanded.
  install_path:
    type: string
    default: ""
    description: >
      Absolute path of the directory to install cargo-auditable into. It is created
      if needed and added to the PATH of later steps when it isn't already on
      it, and must be writable without root. Environment variables are
      expanded. Defaults to $HOME/bin.
  verify_checksums:
    type: enum
    enum: ["false", "known_versions", "strict"]
    default: strict
    description: >
      SHA-512 verification against this orb's checksum table. "strict"
      (default) fails before downloading anything when the version has no
      checksum in the table. "known_versions" verifies listed versions and
      installs unlisted versions unverified, with a warning. "false" skips
      verification and is not recommended.
  version:
    type: string
    default: "0.7.7"
    description: >
      Version of cargo-auditable to install, such as 0.7.7. A leading "v" is
      ignored, and environment variables are expanded.
steps:
  - when:
      condition: << parameters.caching >>
      steps:
        # The key is computed from a file that names the CPU (uname -m, as
        # {{ arch }} also encodes the CPU model and would split the cache by
        # host), HOME (a cache is restored to the absolute path it was saved
        # from), and the version with environment variables expanded.
        - run:
            name: Prepare cargo-auditable cache key
            environment:
              ORB_CACHE_KEY_FILE: /tmp/rust-security-orb-cargo-auditable-cache-key
              PARAM_VERSION: << parameters.version >>
            command: << include(scripts/cache_key.sh) >>
        # A saved cache can't be replaced. Bump v1 when an existing checksum
        # table entry changes, so caches saved for the old bytes stop being
        # restored.
        - restore_cache:
            key: rust-security-orb-cargo-auditable-v1-<< parameters.version >>-{{ checksum "/tmp/rust-security-orb-cargo-auditable-cache-key" }}
  - run:
      name: Install cargo-auditable << parameters.version >>
      environment:
        PARAM_CACHING: << parameters.caching >>
        PARAM_DOWNLOAD_BASE_URL: << parameters.download_base_url >>
        PARAM_INSTALL_PATH: << parameters.install_path >>
        PARAM_VERIFY_CHECKSUMS: << parameters.verify_checksums >>
        PARAM_VERSION: << parameters.version >>
      command: << include(install/cargo-auditable/install.sh) >>
  - when:
      condition: << parameters.caching >>
      steps:
        - save_cache:
            key: rust-security-orb-cargo-auditable-v1-<< parameters.version >>-{{ checksum "/tmp/rust-security-orb-cargo-auditable-cache-key" }}
            paths:
              - ~/.cache/rust-security-orb-cargo-auditable
