name: Upload rust-security-orb reports
description: >
  Uploads output_dir as one workflow artifact, named rust-security-reports-<the directory's name>
  and a random suffix, including when an earlier step failed. Each reporting action uploads
  output_dir after itself by default, so a job that runs several of them uploads the shared
  directory once per action, each time with more in it. Set store_artifacts to false on each of them
  and end the job with this action instead, under if: always(): every report is uploaded once. The
  GitHub Actions twin of the orb's store_reports command.
author: juburr

inputs:
  output_dir:
    description: >
      Absolute path of the directory the reporting commands wrote into: the output_dir they were
      given.
    default: /tmp/rust-security-reports
  store_artifacts:
    description: >
      Upload output_dir. A job that takes a store_artifacts setting of its own can pass it here,
      after setting store_artifacts to false on each reporting action.
    default: "true"

runs:
  using: composite
  steps:
    # Artifact names must be unique in a workflow run, and the same command
    # can run in several jobs or matrix legs, so the name ends in a random
    # suffix.
    - name: Name the reports artifact
      id: artifact
      if: (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output_dir }}
      run: |
        # Named after the directory, as the other actions are after
        # report_name.
        REPORT_NAME=$(basename -- "${OUTPUT_DIR}")
        if [[ ! "${REPORT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            REPORT_NAME=reports
        fi
        printf 'name=rust-security-reports-%s-%s\n' "${REPORT_NAME}" "$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')" >> "${GITHUB_OUTPUT}"
    - name: Upload the reports
      if: always() && (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ inputs.output_dir }}
        if-no-files-found: ignore
