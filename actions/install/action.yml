        printf 'key=rust-security-orb-cargo-cyclonedx-v1-%s\n' "$(sha256sum < "${ORB_CACHE_KEY_FILE}" | cut -c1-64)" >> "${GITHUB_OUTPUT}"
    - name: Restore cargo-cyclonedx cache
      id: cargo-cyclonedx-restore
      if: contains(steps.tools.outputs.list, ' cargo-cyclonedx ') && (inputs.caching == 'true' || inputs.caching == '1')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/rust-security-orb-cargo-cyclonedx
        key: ${{ steps.cargo-cyclonedx-cache-key.outputs.key }}
    - name: Install cargo-cyclonedx
      if: contains(steps.tools.outputs.list, ' cargo-cyclonedx ')
      shell: bash
      env:
        PARAM_CACHING: ${{ inputs.caching }}
        PARAM_DOWNLOAD_BASE_URL: ${{ inputs.download_base_url }}
        PARAM_INSTALL_PATH: ${{ inputs.install_path }}
        PARAM_VERIFY_CHECKSUMS: ${{ inputs.verify_checksums }}
