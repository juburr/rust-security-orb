# cargo-deny policy for the test fixture: RustSec advisories, permissive
# licences, crates.io only. The CI jobs expect the advisories check to fail
# (smallvec 1.6.0 has RUSTSEC-2021-0003) and the others to pass.

[graph]
# Only the targets the fixture ships for.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0"]

[bans]
multiple-versions = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
